<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lithish.Editz | Professional Video Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fafafa;
            color: #111827;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .portfolio-card {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.04);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #d1d5db;
        }
        .logo-text {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
            color: #111827;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: #4b5563;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover {
            color: #111827;
        }
        .hero {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 40px;
            align-items: center;
            margin-bottom: 50px;
        }
        @media(max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
            }
            header {
                flex-direction: column;
                gap: 15px;
            }
        }
        .hero-content h1 {
            font-size: clamp(2.2rem, 4vw, 3.2rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 16px;
            color: #111827;
        }
        .hero-content p {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        @media(max-width: 768px) {
            .btn-group {
                justify-content: center;
            }
        }
        .btn {
            background: #111827;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn.outline {
            background: transparent;
            color: #111827;
            border: 1px solid #d1d5db;
        }
        .btn:hover {
            opacity: 0.85;
        }
        .profile-badge {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            border-radius: 50%;
            border: 2px dashed #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
            color: #4b5563;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #111827;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            overflow: hidden;
            text-align: center;
        }
        .video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            background: #000;
        }
        .video-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-title {
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <!-- Header with Logo and Social Links -->
        <header>
            <div class="logo-area">
                <img src="" alt="Logo" class="logo-img" id="dynamicLogo">
                <div class="logo-text" id="brandName"></div>
            </div>
            <div class="nav-links" id="navLinksContainer">
                <!-- Nav links via JS -->
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1 id="heroTitle"></h1>
                <p id="heroDesc"></p>
                <div class="btn-group" id="btnGroupContainer">
                    <!-- Buttons via JS -->
                </div>
            </div>
            <div>
                <div class="profile-badge">
                    Lithish.Editz Portfolio
                </div>
            </div>
        </section>

        <!-- Featured Projects / Edits Section -->
        <section>
            <div class="section-title">Featured Edits</div>
            <div class="video-grid" id="videoGridContainer">
                <!-- Videos via JS -->
            </div>
        </section>
    </div>

    <!-- JavaScript to Handle Dynamic Content -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // User Data Configuration
            const portfolioData = {
                name: "Lithish.Editz",
                whatsapp: "916379791722",
                email: "lithish1214@gmail.com",
                instagramUrl: "https://instagram.com/Lithish.Editz",
                instagramText: "Instagram: @Lithish.Editz",
                youtubeUrl: "https://youtube.com/@Lithish.Editz",
                youtubeText: "YouTube: @Lithish.Editz",
                logoUrl: "https://i.ibb.co/gbbSKvr2/gbbSKvr2.jpg", // Updated user logo link
                headline: "Professional Video Editor & Creator 👋",
                description: "Crafting cinematic edits, beat-sync transitions, and high-impact visual stories for brands and creators.",
                videos: [
                    {
                        title: "Tata Ace Vahana Poojai Edit",
                        url: "https://www.youtube.com/embed/zeTYnokf3BA?autoplay=1&mute=1&loop=1"
                    },
                    {
                        title: "Yamaha MT-15 Edit",
                        url: "https://www.youtube.com/embed/iRg6EGmbFVk?autoplay=1&mute=1&loop=1"
                    },
                    {
                        title: "Rayappan Mass / Cinematic Edit",
                        url: "https://www.youtube.com/embed/kJSb7K1x_mM?autoplay=1&mute=1&loop=1"
                    }
                ]
            };

            // Set Brand Name & Logo
            document.getElementById("brandName").innerText = portfolioData.name;
            const logoElement = document.getElementById("dynamicLogo");
            logoElement.src = portfolioData.logoUrl;

            // Set Navigation Links
            const navContainer = document.getElementById("navLinksContainer");
            navContainer.innerHTML = `
                <a href="${portfolioData.instagramUrl}" target="_blank">Instagram</a>
                <a href="${portfolioData.youtubeUrl}" target="_blank">YouTube</a>
                <a href="mailto:${portfolioData.email}">Email</a>
            `;

            // Set Hero Content
            document.getElementById("heroTitle").innerText = portfolioData.headline;
            document.getElementById("heroDesc").innerText = portfolioData.description;

            // Set Action Buttons
            const btnContainer = document.getElementById("btnGroupContainer");
            btnContainer.innerHTML = `
                <a href="https://wa.me/${portfolioData.whatsapp}?text=Hi%20Lithish!" class="btn" target="_blank">WhatsApp: ${portfolioData.whatsapp}</a>
                <a href="mailto:${portfolioData.email}" class="btn outline">Email: ${portfolioData.email}</a>
            `;

            // Dynamically Render Videos
            const gridContainer = document.getElementById("videoGridContainer");
            gridContainer.innerHTML = "";

            portfolioData.videos.forEach(video => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.innerHTML = `
                    <div class="video-frame">
                        <iframe src="${video.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    </div>
                    <div class="video-title">${video.title}</div>
                `;
                gridContainer.appendChild(card);
            });
        });
    </script>
</body>
</html>
