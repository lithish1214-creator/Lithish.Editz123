<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LITHISH.EDITZ | Video Editor & Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
        }
        .logo {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
        }
        nav {
            display: flex;
            gap: 24px;
            font-size: 14px;
            font-weight: 500;
        }
        nav a {
            color: #475569;
            text-decoration: none;
            transition: 0.2s;
        }
        nav a:hover {
            color: #0f172a;
        }
        .hero {
            max-width: 1100px;
            margin: 40px auto 80px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: center;
        }
        @media(max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                margin: 20px auto 40px;
            }
            nav { display: none; }
        }
        .hero-content h3 {
            font-size: 16px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 12px;
        }
        .hero-content h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            color: #0f172a;
        }
        .hero-content p {
            color: #475569;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        @media(max-width: 768px) {
            .btn-group { justify-content: center; }
        }
        .btn {
            background: #0f172a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 99px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn.outline {
            background: transparent;
            color: #0f172a;
            border: 1px solid #cbd5e1;
        }
        .btn:hover { opacity: 0.85; }
        .hero-visual {
            display: flex;
            justify-content: center;
        }
        .video-container {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 9/16;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            background: #000;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">LITHISH.EDITZ</div>
        <nav>
            <a href="#">Home</a>
            <a href="https://instagram.com/Lithish.Editz" target="_blank">Instagram</a>
            <a href="https://youtube.com/@Lithish.Editz" target="_blank">YouTube</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h3>Hey, I'm Lithish 👋</h3>
            <h1>Freelance Video Editor & Creator</h1>
            <p>I help creators and brands turn their raw footage into cinematic masterpieces with stunning visual effects, color grading, and engaging storytelling.</p>
            <div class="btn-group">
                <a href="https://wa.me/916379791722?text=Hi%20Lithish!" class="btn" target="_blank">Get in Touch</a>
                <a href="mailto:lithish1214@gmail.com" class="btn outline">Email Me</a>
            </div>
        </div>
        <div class="hero-visual">
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/iRg6EGmbFVk?autoplay=1&mute=1&loop=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </section>

</body>
</html>
