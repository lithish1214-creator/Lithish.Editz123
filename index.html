    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 24px;
            color: #22d3ee;
            margin-bottom: 5px;
        }
        p {
            font-size: 13px;
            color: #8b949e;

        }
        .links-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            background: #21262d;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn.wa { background: #238636; border: none; }
        .btn.insta { background: #bc1888; border: none; }
        .btn.yt { background: #ff0000; border: none; }
        .btn:hover { opacity: 0.9; }
        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
